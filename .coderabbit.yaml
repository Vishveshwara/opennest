# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: true
  path_instructions:
    - path: "**/*"
      instructions: >-
        Review against AGENTS.md and docs/PROJECT_PLAN.md. Distinguish planned
        behavior from implemented behavior. Prioritize correctness, secrets,
        authorization, sandbox isolation, and concurrency over style.
        Require matching API/schema context updates for behavioral changes.
        Enforce OpenNest as the product name, with lowercase opennest for technical
        identifiers. Require India-wide launch support, nationwide search when
        city is omitted, and no default city or fixed city allowlist.
        Check rental mode, price basis, inventory, and search consistency against
        docs/LISTING_SEARCH.md. Keep deployment proposals aligned with
        docs/DEPLOYMENT_STACK.md; do not treat local Compose as production-ready.
    - path: "backend/**"
      instructions: >-
        Check transactional listing/reveal quotas, Google OIDC state/nonce/PKCE,
        session fixation and CSRF defenses, safe identity linking, deferred
        WhatsApp signature/replay checks, owner authorization, report idempotency, and production
        rejection of demo credentials. Sandbox headers cannot select a database.
        No automatic listing suspension based on reports or ratings.
    - path: "frontend/**"
      instructions: >-
        Preserve TweakCN variables and semantic tokens. Check accessibility,
        mobile usability, private-data cache leaks, and immediate warning updates.
        No public navigation to recruiter tools; hidden links are not security.
        Show PG prices per person per month, entire-flat prices per property per
        month, and individual flat-room prices per room per month. Distinguish
        bedrooms/BHK, available rooms, and whole-flat availability.
        Display owner-set people limits per flat or per room without multiplying
        the quoted rent or treating capacity as current vacancy.
